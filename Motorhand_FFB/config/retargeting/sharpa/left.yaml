# scripts/fit_sharpa_retarget.py 生成；Sharpa私有目标函数及损失权重遵循Wuji。
# canonical方向与Sharpa URDF一致；geometry拟合掌尺度/腕参考，无额外90度旋转。
# 比例由闭链模型多姿态训练集拟合，见fit_report.json；不是实物标定。
geometry:
  task_axis_scale:
  - 1.2041908961403003
  - 0.8671164549901542
  - 0.8987620944698567
  wrist_offset_m:
  - -0.000296924914391105
  - -0.011824579084050007
  - 0.03645516319877008
optimizer:
  type: AdaptiveOptimizerAnalytical
  urdf_path: ../../../assets/sharpa-hand/wave_01/left_sharpa_wave/left_sharpa_wave_pad.urdf
  link_naming:
    prefix: left_
    palm: hand_C_MC
    fingers:
    - thumb
    - index
    - middle
    - ring
    - pinky
    pip: '{finger}_pad_pip'
    dip: '{finger}_pad_dip'
    tip: '{finger}_pad_tip'
    link1: '{finger}_MCP_VL'
retarget:
