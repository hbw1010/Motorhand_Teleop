    - 0.82131
    - 1.079161
    - 1.121078
    index:
    - 1.257721
    - 1.231155
    - 1.112958
    middle:
    - 0.903106
    - 1.157743
    - 1.097482
    ring:
    - 1.333117
    - 1.196543
    - 0.982162
    pinky:
    - 1.585587
    - 0.844408
    - 1.32363
  pinch_thresholds:
