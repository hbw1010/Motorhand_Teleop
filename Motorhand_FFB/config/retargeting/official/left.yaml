# 任务点：指腹（scripts/generate_pad_task_points.py 生成 *_pad.urdf 的固定坐标系）。
# segment_scaling 由同一脚本重新标定（见 fit_pad_scaling），不是手调值。
# 原手指中心轴线版本：left_axis.yaml
# 基于官方 WujiRetarget Hand2 配置；输入来自 vE.3.3 闭链模型重建的21点，
# 不是 Wuji Glove SDK 原始帧。所有标定参数仍需本项目独立验证。
#
# 当前项目只依赖 URDF IK，未导入官方 MJCF；仿真路径后续另行接入。

optimizer:
  type: "AdaptiveOptimizerAnalytical"
  # --- Wuji Hand 2 at hand2/hand2_beta1/body/ in the wuji-description
  # submodule. Both IK and sim use the official assets shipped there:
  #   IK  : urdf_path  -> official hand2/hand2_beta1/body/urdf (Pinocchio; meshes not loaded)
  #   sim : mjcf_path  -> official hand2/hand2_beta1/body/mjcf (MuJoCo; meshes under hand2/hand2_beta1/body/meshes)
  urdf_path: "../../../assets/wuji-hand2/body/urdf/left_pad.urdf"
  # Wuji Hand 2 uses anatomical link names (l_wrist / l_index_finger_pip ...).
  # link_naming maps the optimizer's logical roles onto them so the retargeting
  # code stays URDF-agnostic. fingers are ordered thumb..pinky.
  link_naming:
    prefix: "l_"
    palm:    "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip:     "{finger}_pad_pip"           # PIP
    dip:     "{finger}_pad_dip"           # DIP
    tip:     "{finger}_pad_tip"           # fingertip
    link1:   "{finger}_proximal_abd"  # MCP abduction link (finger-plane ref)

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  w_full_hand: 1.0
  # 暂不估计四指 MCP 侧摆；固定为零并锁进优化器边界。
  fixed_joints:
    l_index_finger_mcp_abd: 0.0
    l_middle_finger_mcp_abd: 0.0
    l_ring_finger_mcp_abd: 0.0
    l_pinky_mcp_abd: 0.0
  w_hyper: 1.0           # PIP/DIP joints below soft_min are penalized quadratically
  soft_min: 0.0          # joint angle threshold (rad); 0 = no negative angles allowed
  w_couple: 0.1          # DIP pulled toward couple_ratio * PIP per finger
  couple_ratio: 0.7      # biomechanical (DIP curls ~70% of PIP)
  lp_alpha: 0.2

  # Per-segment scaling of the retargeted finger lengths (per finger: proximal,
  # middle, distal). Tune per hand if the fingertips over- or under-reach the
  # target keypoints.
  # segment_scaling:
  #   thumb:  [0.9, 0.9, 0.9]
  #   index:  [0.95, 0.95, 0.95]
  #   middle: [0.9, 0.9, 0.9]
  #   ring:   [0.9, 0.9, 0.9]
  #   pinky:  [1.0, 1.0, 1.0]

  segment_scaling:
    # 骨架到 WujiHand2 的三段几何比例；不是优化损失权重。
    thumb:  [1.05, 1.047, 1.029]
    index:  [1.114, 1.134, 1.106]
    middle: [1.056, 1.054, 1.036]
    ring:   [1.065, 1.077, 1.056]
    pinky:  [1.091, 1.166, 1.145]

  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }
  pinch_weight_max: 0.7   # 对指权重上限（C++ WujiRetarget 读；vendor 里的 Python 版固定 0.7）
  # vE3.3 任务点由适配器先转成官方 canonical 掌坐标；不再叠加相机设备旋转。
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0

  wrist_offset_cm: [0.0, 0.0, 0.0]   # disabled: SDK uses per-SN calibrated URDF, no extra bias needed
  thumb_offset_cm: [0.0, 0.0, 0.0]   # disabled: same reason

wuji_glove:
  device_name: "glove"
