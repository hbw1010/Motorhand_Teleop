<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motorhand 仿真实时遥测</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}body{margin:0;background:#111823;color:#e6edf4}header{padding:16px 22px;background:#1b2735;position:sticky;top:0;z-index:2}h1{font-size:20px;margin:0 0 6px}.note{color:#b6c5d5;font-size:13px}#status{float:right;color:#7fe0ad}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(490px,1fr));gap:14px;padding:16px}.card{background:#1a2634;border:1px solid #33465a;border-radius:8px;padding:12px;min-width:0}.card h2{font-size:15px;margin:0 0 6px}.card p{color:#a7bbce;font-size:12px;margin:0 0 6px}canvas{display:block;width:100%;height:220px}.legend{font-size:11px;display:flex;flex-wrap:wrap;gap:3px 12px;max-height:48px;overflow:auto}.legend span{white-space:nowrap}.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}
</style></head>
<body><header><span id="status">等待数据</span><h1>Motorhand · 实时仿真遥测</h1><div class="note" id="object-config">物体参数加载中</div><div class="note">仿真受力 ≠ 真实测力；反馈力矩为名义指令。显示降采样，完整数据以 JSONL 为准。</div></header>
<main class="grid" id="grid"></main>
<script>
'use strict';
const fingers=['thumb','index','middle','ring','pinky'];
const colors=['#59b9ff','#ffb454','#78dc9d','#ef80a8','#b7a0ff','#65d5d0','#ff958b','#d9cb76','#a8bde7','#e5a2dd','#7ebf9d','#f8a45a'];
const specs=[
 ['force','每指接触力','仿真法向力 [N]，五指各接触点求和'],
 ['torque','电机反馈力矩','上限及斜率约束后计算值 [Nm]；虚线为已提交 SDK 的名义指令'],
 ['limiting','电机反馈限幅','受力矩上限和斜率限制的轴数；不代表真实测得力矩'],
 ['joint','输入手套运动','输入独立指节角 [rad]；真实手套时由闭链估计'],
 ['simjoint','仿真手套运动','接触约束后的虚拟独立指节角 [rad]'],
 ['motor','输入电机位置','实测或脚本输入的电机位置 [rad]'],
 ['simmotor','仿真电机位置','接触约束后的虚拟电机位置 [rad]'],
 ['current','电机电流反馈','真实设备返回的原始电流 [A]；未连接时为空'],
 ['displacement','每指力—接触穿透','每指法向力 [N] 对该指最大接触穿透深度 [m]；不是物体形变量'],
 ['deformation','球体形变','软体顶点到顶点质心的径向距离变化最大值 [m]；刚体无数据'],
 ['forcedeformation','每指力—球体形变','各指仿真法向力 [N] 对球体最大径向形变 [m]'],
 ['latency','软件阶段延迟','输入采样→接触计算、接触计算→SDK 提交 [ms]；不是电机物理响应延迟'],
 ['motion','物体运动','物体世界位置 [m]'],
 ['slip','接触滑移速度','接触点切向相对速度 [m/s]'],
 ['grasp','多指接触状态','启发式状态，不代表已验证的稳定抓取']
];
for(const [id,title,desc] of specs){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=desc;const c=document.createElement('canvas');c.id=id;c.width=900;c.height=300;const l=document.createElement('div');l.className='legend';l.id=id+'-legend';card.append(h,p,c,l);document.getElementById('grid').append(card)}
function num(x){return typeof x==='number'&&Number.isFinite(x)?x:null}
function tick(x){return x!==0&&Math.abs(x)<0.01?x.toExponential(2):x.toFixed(2)}
function plot(id, lines, xlabel){
 const canvas=document.getElementById(id),ctx=canvas.getContext('2d'); const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
 const legend=document.getElementById(id+'-legend');legend.replaceChildren();
 lines=lines.filter(l=>l.points.some(p=>num(p[0])!==null&&num(p[1])!==null));
 const valid=lines.flatMap(l=>l.points.filter(p=>num(p[0])!==null&&num(p[1])!==null));
 ctx.fillStyle='#97aec2';ctx.font='16px sans-serif';if(!valid.length){ctx.fillText('暂无可用数据',20,40);return}
 let xs=valid.map(p=>p[0]),ys=valid.map(p=>p[1]); let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
 if(xmax===xmin){xmax+=1;xmin-=1}if(ymax===ymin){ymax+=1;ymin-=1} const ypad=(ymax-ymin)*.08;ymax+=ypad;ymin-=ypad;
 const L=64,R=w-18,T=12,B=h-34; ctx.strokeStyle='#40566a';ctx.lineWidth=1;
 for(let i=0;i<=4;i++){const y=T+(B-T)*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();ctx.fillText((ymax-(ymax-ymin)*i/4).toPrecision(3),2,y+5)}
 ctx.fillText(tick(xmin),L,B+22);ctx.fillText(tick(xmax),R-85,B+22);ctx.fillText(xlabel,(L+R)/2-40,B+22);
 lines.forEach((line,i)=>{const color=colors[i%colors.length];ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash(line.dashed?[6,5]:[]);ctx.beginPath();let on=false;
 for(const [x,y] of line.points){if(num(x)===null||num(y)===null){on=false;continue}const px=L+(x-xmin)/(xmax-xmin)*(R-L),py=B-(y-ymin)/(ymax-ymin)*(B-T);if(!on){ctx.moveTo(px,py);on=true}else ctx.lineTo(px,py)}ctx.stroke();
 const span=document.createElement('span'),mark=document.createElement('i');mark.style.background=color;span.append(mark,document.createTextNode(line.name));legend.append(span)});ctx.setLineDash([]);
}
function scalar(rows,field){return rows.map(r=>[num(r.sim_time_s),num(r[field])])}
function vectors(rows,field,names,lookup){return names.map((name,i)=>({name,points:rows.map(r=>{const x=r[field],v=x==null?null:(lookup?x[name]:x[i]);return[num(r.sim_time_s),num(v)]})}))}
function render(data){const r=data.samples, names=data.motor_names||[], recent=r.slice(-50);
 const wall=recent.reduce((n,x)=>n+(num(x.control_interval_s)||0),0), sim=recent.reduce((n,x)=>n+(num(x.simulation_step_s)||0),0), speed=wall>0?` · 仿真速度 ${(sim/wall).toFixed(2)}×`:'';
 const scene=data.scene||{}, latest=r[r.length-1]||{}, dims=latest.object_dimensions_m;
 const paused=latest.feedback_pause_reason==='dragging'?' · 拖动：已请求暂停出力':latest.feedback_pause_reason==='waiting_clear'?' · 等待到位并脱离接触':'';
 document.getElementById('status').textContent=`在线 · ${r.length} 样本 · 显示跳过 ${data.skipped}${speed}${paused}`;
 const size=Array.isArray(dims)?dims.map(x=>Number(x).toFixed(3)).join(' × '):`${scene.object_size_m??'未知'}`;
 document.getElementById('object-config').textContent=`物体：${scene.object_shape||'未知'} · ${scene.object_model==='deformable'?'可形变':'刚体'} · 三轴尺寸 ${size} m · 材质 ${scene.object_material||'未知'} · ${scene.object_fixed?'锚定':'自由'} · 预设 ${scene.stiffness||'未知'}`;
 plot('force',vectors(r,'contact_force_n',fingers,true),'仿真时间 s');
 const torque=vectors(r,'computed_torque_nm',names,false);const sent=vectors(r,'command_torque_nm',names,false);for(const l of sent){l.name+=' (SDK)';l.dashed=true}plot('torque',torque.concat(sent),'仿真时间 s');
 const bounds=[['力矩上限','torque_limited'],['斜率限制','slew_limited']].map(([name,key])=>({name,points:r.map(x=>[num(x.sim_time_s),Array.isArray(x[key])?x[key].filter(Boolean).length:null])}));plot('limiting',bounds,'仿真时间 s');
 const jointNames=['拇指屈','拇指展','拇指MCP','拇指IP','食指MCP','食指PIP','中指MCP','中指PIP','无名指MCP','无名指PIP','小指MCP','小指PIP'];
 plot('joint',vectors(r,'joint_position_rad',jointNames,false),'仿真时间 s');
 plot('simjoint',vectors(r,'sim_joint_position_rad',jointNames,false),'仿真时间 s');
 plot('motor',vectors(r,'motor_position_rad',names,false),'仿真时间 s');
 plot('simmotor',vectors(r,'sim_motor_position_rad',names,false),'仿真时间 s');
 plot('current',vectors(r,'motor_current_a',names,false),'仿真时间 s');
 plot('displacement',fingers.map(f=>({name:f,points:r.map(x=>[num((x.contact_penetration_m||{})[f]),num((x.contact_force_n||{})[f])])})),'穿透深度 m');
 plot('deformation',[{name:'最大径向形变',points:scalar(r,'object_deformation_m')}],'仿真时间 s');
 plot('forcedeformation',fingers.map(f=>({name:f,points:r.map(x=>[num(x.object_deformation_m),num((x.contact_force_n||{})[f])])})),'球体形变 m');
 const delays=[['输入→接触','input_time_ns','contact_time_ns'],['接触→SDK','contact_time_ns','command_time_ns']].map(([name,a,b])=>({name,points:r.map(x=>[num(x.sim_time_s),num(x[a])!==null&&num(x[b])!==null&&x[b]>=x[a]?(x[b]-x[a])/1e6:null])}));plot('latency',delays,'仿真时间 s');
 plot('motion',vectors(r,'object_position_m',['x','y','z'],false),'仿真时间 s');
 plot('slip',[{name:'接触切向相对速度 m/s',points:scalar(r,'slip_speed_m_s')}],'仿真时间 s');
 const state={no_contact:0,single_contact:1,multi_contact:2,sliding:3};plot('grasp',[{name:'0无接触 1单指 2多指 3滑移',points:r.map(x=>[num(x.sim_time_s),state[x.grasp_state]??null])}],'仿真时间 s');
}
async function refresh(){try{const response=await fetch('/data',{cache:'no-store'});if(!response.ok)throw Error(response.status);render(await response.json())}catch(e){document.getElementById('status').textContent='已断开';}setTimeout(refresh,500)}refresh();
</script></body></html>
